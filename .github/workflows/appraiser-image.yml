name: appraiser image

on:
  push:
    branches: [main]
    paths: ["service/**", ".github/workflows/appraiser-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: |
          python -m pip install -q -r service/requirements.txt
          cd service && python -m pytest -q tests
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: service
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bottletree-appraiser:latest
            ghcr.io/${{ github.repository_owner }}/bottletree-appraiser:${{ github.sha }}
